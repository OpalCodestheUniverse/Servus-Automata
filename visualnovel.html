            font-family: var(--font-sans);
            color: var(--text-main);
            overflow: hidden;

            height: 100vh;
            display: flex;

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-position: center;
            transition: filter 1s ease, transform 1s ease, background-image 0.8s ease;

            height: 100%;
            z-index: 2;
            pointer-events: none;

            position: absolute;
            top: 0;
            left: 0;

            background-size: 100% 4px, 6px 100%;
            z-index: 3;
            pointer-events: none;

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
            z-index: 4;
            pointer-events: none;

<script>
/**
 * Procedural Audio Synthesizer (Web Audio API)
 * Generates dark ambient hums, rain noise, airlock whooshes, and heartbeats dynamically.
 */
class VNSystemAudio {
    constructor() {
        self = this;
        this.ctx = null;
        this.enabled = true;
        this.noiseNode = null;
        this.droneOsc = null;
        this.gainNode = null;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            this.gainNode = this.ctx.createGain();
            this.gainNode.gain.value = 0.15;
            this.gainNode.connect(this.ctx.destination);
            this.startAmbient();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    toggleAudio() {
        this.enabled = !this.enabled;
        if (this.gainNode) {
            this.gainNode.gain.value = this.enabled ? 0.15 : 0;
        }
        return this.enabled;
    }

    startAmbient() {
        if (!this.ctx) return;
        
        // Dark Low Drone
        this.droneOsc = this.ctx.createOscillator();
        const droneGain = this.ctx.createGain();
        this.droneOsc.type = 'sawtooth';
        this.droneOsc.frequency.setValueAtTime(55, this.ctx.currentTime); // A1 note
        
        // Lowpass Filter for moody synth
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(180, this.ctx.currentTime);

        droneGain.gain.value = 0.3;
        this.droneOsc.connect(filter);
        filter.connect(droneGain);
        droneGain.connect(this.gainNode);
        this.droneOsc.start();

        // Procedural Rain / HVAC Ambient Noise
        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }

        this.noiseNode = this.ctx.createBufferSource();
        this.noiseNode.buffer = noiseBuffer;
        this.noiseNode.loop = true;

        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(800, this.ctx.currentTime);
        noiseFilter.Q.setValueAtTime(1.0, this.ctx.currentTime);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.value = 0.08;

        this.noiseNode.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(this.gainNode);
        this.noiseNode.start();
    }

    playAirlockWhoosh() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
        g.gain.setValueAtTime(0.4, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.connect(g);
        g.connect(this.gainNode);
        osc.start(now);
        osc.stop(now + 0.8);
    }

    playHeartbeat() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        [0, 0.22].forEach(delay => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, now + delay);
            osc.frequency.exponentialRampToValueAtTime(30, now + delay + 0.15);
            g.gain.setValueAtTime(0.6, now + delay);
            g.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
            osc.connect(g);
            g.connect(this.gainNode);
            osc.start(now + delay);
            osc.stop(now + delay + 0.15);
        });
    }

    playBeep() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, now);
        g.gain.setValueAtTime(0.05, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(g);
        g.connect(this.gainNode);
        osc.start(now);
        osc.stop(now + 0.05);
    }
}

/**
 * Visual Canvas Particle Renderer (Rain & Atmosphere)
 */
class VisualEffects {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.drops = [];
        this.mode = 'rain'; // 'rain', 'fog', or 'none'
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initRain();
        this.animate();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    initRain() {
        this.drops = [];
        for (let i = 0; i < 120; i++) {
            this.drops.push({
                x: Math.random() * this.canvas.width,
                y: Math.random() * this.canvas.height,
                len: Math.random() * 18 + 10,
                speed: Math.random() * 12 + 10,
                opacity: Math.random() * 0.3 + 0.1
            });
        }
    }

    setMode(mode) {
        this.mode = mode;
    }

    animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        if (this.mode === 'rain') {
            this.ctx.strokeStyle = 'rgba(180, 210, 240, 0.4)';
            this.ctx.lineWidth = 1;
            for (let d of this.drops) {
                this.ctx.beginPath();
                this.ctx.moveTo(d.x, d.y);
                this.ctx.lineTo(d.x - 2, d.y + d.len);
                this.ctx.stroke();

                d.y += d.speed;
                d.x -= 1;

                if (d.y > this.canvas.height) {
                    d.y = -20;
                    d.x = Math.random() * this.canvas.width;
                }
            }
        }

        requestAnimationFrame(() => this.animate());
    }
}

/**
 * Visual Novel Engine Controller
 */
class VisualNovelEngine {
    constructor(script) {
        this.script = script;
        this.currentIndex = 0;
        this.typewriterSpeed = 22; // ms per char
        this.isTyping = false;
        this.autoPlay = false;
        this.autoTimer = null;
        this.historyLog = [];

        this.audio = new VNSystemAudio();
        this.vfx = new VisualEffects('fx-canvas');

        // UI Element References
        this.bgLayer = document.getElementById('bg-layer');
        this.speakerName = document.getElementById('speaker-name');
        this.dialogueText = document.getElementById('dialogue-text');
        this.charFrame = document.getElementById('character-frame');
        this.avatarIcon = document.getElementById('avatar-icon');
        this.choiceOverlay = document.getElementById('choice-overlay');
        this.panicOverlay = document.getElementById('panic-overlay');
        this.flashOverlay = document.getElementById('flash-overlay');

        this.initEvents();
    }

    initEvents() {
        document.getElementById('dialogue-area').addEventListener('click', () => this.next());
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') this.next();
        });

        // UI Header Buttons
        document.getElementById('btn-audio').addEventListener('click', (e) => {
            e.stopPropagation();
            const enabled = this.audio.toggleAudio();
            e.target.innerText = `Sound: ${enabled ? 'ON' : 'OFF'}`;
        });

        document.getElementById('btn-auto').addEventListener('click', (e) => {
            e.stopPropagation();
            this.autoPlay = !this.autoPlay;
            e.target.innerText = `Auto: ${this.autoPlay ? 'ON' : 'OFF'}`;
            if (this.autoPlay) this.next();
        });

        document.getElementById('btn-save').addEventListener('click', (e) => {
            e.stopPropagation();
            localStorage.setItem('aeterna_noctu_save', this.currentIndex);
            alert('Progress Quick-Saved!');
        });

        document.getElementById('btn-load').addEventListener('click', (e) => {
            e.stopPropagation();
            const saved = localStorage.getItem('aeterna_noctu_save');
            if (saved !== null) {
                this.currentIndex = parseInt(saved, 10);
                this.renderScene();
                alert('Progress Loaded!');
            } else {
                alert('No Quick Save found.');
            }
        });

        document.getElementById('btn-log').addEventListener('click', (e) => {
            e.stopPropagation();
            this.showLog();
        });

        document.getElementById('btn-close-log').addEventListener('click', () => {
            document.getElementById('log-modal').style.display = 'none';
        });
    }

    start() {
        this.renderScene();
    }

    renderScene() {
        this.audio.init();
        if (this.currentIndex >= this.script.length) return;

        const scene = this.script[this.currentIndex];

        // Background & VFX
        this.bgLayer.style.background = scene.bg;
        this.vfx.setMode(scene.fx || 'none');

        // Audio Effects
        if (scene.sfx === 'airlock') this.audio.playAirlockWhoosh();
        if (scene.panic) {
            this.panicOverlay.classList.add('pulsing');
            this.audio.playHeartbeat();
        } else {
            this.panicOverlay.classList.remove('pulsing');
        }

        // Speaker & Avatar Setup
        this.speakerName.innerText = scene.speaker;
        if (scene.avatar) {
            this.avatarIcon.innerText = scene.avatar;
            this.charFrame.style.opacity = '1';
        } else {
            this.charFrame.style.opacity = '0';
        }

        // Add to Transcript Log
        this.historyLog.push({ speaker: scene.speaker, text: scene.text });

        // Handle Typing Animation
        this.typeText(scene.text, () => {
            if (scene.choice) {
                this.renderChoices(scene.choice);
            } else if (this.autoPlay) {
                this.autoTimer = setTimeout(() => this.next(), 2400);
            }
        });
    }

    typeText(text, callback) {
        this.isTyping = true;
        this.dialogueText.innerText = '';
        let i = 0;

        if (this.typeTimer) clearInterval(this.typeTimer);

        this.typeTimer = setInterval(() => {
            this.dialogueText.innerText += text.charAt(i);
            if (i % 3 === 0) this.audio.playBeep();
            i++;
            if (i >= text.length) {
                clearInterval(this.typeTimer);
                this.isTyping = false;
                if (callback) callback();
            }
        }, this.typewriterSpeed);
    }

    renderChoices(choices) {
        this.choiceOverlay.innerHTML = '';
        this.choiceOverlay.classList.add('active');

        choices.forEach(ch => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = ch.text;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                this.choiceOverlay.classList.remove('active');
                this.currentIndex = ch.target;
                this.renderScene();
            });
            this.choiceOverlay.appendChild(btn);
        });
    }

    next() {
        if (this.choiceOverlay.classList.contains('active')) return;

        if (this.isTyping) {
            // Fast-forward text
            clearInterval(this.typeTimer);
            this.dialogueText.innerText = this.script[this.currentIndex].text;
            this.isTyping = false;
            return;
        }

        if (this.autoTimer) clearTimeout(this.autoTimer);

        this.currentIndex++;
        if (this.currentIndex < this.script.length) {
            this.renderScene();
        }
    }

    showLog() {
        const modal = document.getElementById('log-modal');
        const content = document.getElementById('log-content');
        content.innerHTML = '';

        this.historyLog.forEach(entry => {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<div class="log-speaker">${entry.speaker}</div><div class="log-text">${entry.text}</div>`;
            content.appendChild(div);
        });

        modal.style.display = 'flex';
    }
}

// Initialize VN Engine when loaded
window.addEventListener('load', () => {
    const vnApp = new VisualNovelEngine(CHAPTER_1_SCRIPT);
    vnApp.start();
});
