<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG1C | Interactive Book</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --book-bg: #181a20;
            --page-bg: #20232c;
            --page-border: #2d313d;
            --accent-gold: #d4a359;
            --text-main: #e2e4e9;
            --text-muted: #8b92a2;
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Consolas', 'Monaco', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 30%, #1a1d26 0%, var(--bg-color) 80%);
        }

        /* Top Header & Chapter Nav */
        header {
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-logo {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .chapter-nav {
            display: flex;
            gap: 15px;
        }

        .chapter-btn {
            background: transparent;
            border: 1px solid var(--page-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-sans);
        }

        .chapter-btn:hover, .chapter-btn.active {
            color: var(--text-main);
            border-color: var(--accent-gold);
            background-color: rgba(212, 163, 89, 0.1);
        }

        /* Book Perspective Stage */
        .stage {
            perspective: 2000px;
            width: 100%;
            max-width: 1050px;
            height: 640px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        /* 3D Book Container */
        .book {
            width: 960px;
            height: 600px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            background-color: var(--book-bg);
        }

        /* Center Spine Crease */
        .spine {
            position: absolute;
            left: 50%;
            top: 0;
            width: 20px;
            height: 100%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(0,0,0,0.4), rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.4));
            z-index: 15;
            pointer-events: none;
        }

        /* Static Page Display Sides */
        .page-side {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: var(--page-bg);
            border: 1px solid var(--page-border);
            padding: 40px 45px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .left-side {
            left: 0;
            border-radius: 6px 0 0 6px;
            border-right: 1px solid rgba(0,0,0,0.5);
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.2);
        }

        .right-side {
            right: 0;
            border-radius: 0 6px 6px 0;
            border-left: 1px solid rgba(0,0,0,0.5);
            box-shadow: inset 15px 0 20px rgba(0,0,0,0.2);
        }

        /* 3D ANIMATED FLIPPING LEAF */
        .flipping-leaf {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            z-index: 20;
            pointer-events: none;
            display: none;
        }

        .flipping-leaf.active {
            display: block;
        }

        .leaf-face {
            position: absolute;
            inset: 0;
            background-color: var(--page-bg);
            border: 1px solid var(--page-border);
            padding: 40px 45px;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .leaf-front {
            border-radius: 0 6px 6px 0;
            box-shadow: inset 15px 0 20px rgba(0,0,0,0.2);
        }

        .leaf-back {
            transform: rotateY(180deg);
            border-radius: 6px 0 0 6px;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.2);
        }

        /* INTERACTIVE CORNER PEELS (PAGE TURN TRIGGERS) */
        .corner-peel {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 30;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .corner-peel::before {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            transition: all 0.2s ease;
        }

        /* Top Right / Bottom Right (Next Page) */
        .corner-peel.top-right { top: 0; right: 0; }
        .corner-peel.top-right::before {
            top: 0; right: 0;
            border-width: 0 25px 25px 0;
            border-color: transparent var(--accent-gold) transparent transparent;
            opacity: 0.4;
        }

        .corner-peel.bottom-right { bottom: 0; right: 0; }
        .corner-peel.bottom-right::before {
            bottom: 0; right: 0;
            border-width: 0 0 25px 25px;
            border-color: transparent transparent var(--accent-gold) transparent;
            opacity: 0.4;
        }

        /* Top Left / Bottom Left (Prev Page) */
        .corner-peel.top-left { top: 0; left: 0; }
        .corner-peel.top-left::before {
            top: 0; left: 0;
            border-width: 25px 25px 0 0;
            border-color: var(--accent-gold) transparent transparent transparent;
            opacity: 0.4;
        }

        .corner-peel.bottom-left { bottom: 0; left: 0; }
        .corner-peel.bottom-left::before {
            bottom: 0; left: 0;
            border-width: 25px 0 0 25px;
            border-color: transparent transparent transparent var(--accent-gold);
            opacity: 0.4;
        }

        .corner-peel:hover::before {
            opacity: 1;
            transform: scale(1.2);
        }

        .corner-peel.disabled {
            display: none !important;
        }

        /* Typography & Page Content Styling */
        .page-header {
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .page-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--text-main);
            font-weight: normal;
        }

        .page-subtitle {
            font-size: 0.85rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .content-body {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-main);
        }

        .content-body p {
            margin-bottom: 16px;
        }

        .content-body p.story-text {
            font-family: var(--font-serif);
            font-size: 0.98rem;
            line-height: 1.8;
            color: #d1d5db;
        }

        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            color: var(--accent-gold);
            margin: 20px 0 10px 0;
        }

        /* Lists and Cards */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--page-border);
            padding: 14px;
            border-radius: 4px;
        }

        .card-title {
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Contact Form */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .form-control {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--page-border);
            border-radius: 4px;
            padding: 10px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.85rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .submit-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .page-footer-num {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 15px;
            font-family: var(--font-mono);
        }

        footer {
            padding: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Responsive Layout fallback */
        @media (max-width: 980px) {
            .stage {
                height: auto;
            }
            .book {
                width: 100%;
                height: auto;
                flex-direction: column;
            }
            .page-side {
                position: relative;
                width: 100%;
                min-height: 450px;
            }
            .corner-peel, .flipping-leaf {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Chapter Jump Navigation -->
    <header>
        <a href="#" class="brand-logo" onclick="goToPage(0); return false;">LOG1C</a>
        <nav class="chapter-nav">
            <button class="chapter-btn" id="nav-fictions" onclick="goToPage(1)">Fictions</button>
            <button class="chapter-btn" id="nav-projects" onclick="goToPage(2)">Projects</button>
            <button class="chapter-btn" id="nav-decklists" onclick="goToPage(3)">Decklists</button>
            <button class="chapter-btn" id="nav-about" onclick="goToPage(4)">About</button>
        </nav>
    </header>

    <!-- Main Book Stage -->
    <div class="stage">
        <div class="book" id="book">
            
            <div class="spine"></div>

            <!-- Page Corners (Click to turn page) -->
            <div class="corner-peel top-left" onclick="turnPrev()" title="Previous Page"></div>
            <div class="corner-peel bottom-left" onclick="turnPrev()" title="Previous Page"></div>
            <div class="corner-peel top-right" onclick="turnNext()" title="Next Page"></div>
            <div class="corner-peel bottom-right" onclick="turnNext()" title="Next Page"></div>

            <!-- Static Left Page -->
            <div class="page-side left-side" id="leftSide">
                <div id="leftContent"></div>
                <div class="page-footer-num" id="leftPageNum">Page 1</div>
            </div>

            <!-- Static Right Page -->
            <div class="page-side right-side" id="rightSide">
                <div id="rightContent"></div>
                <div class="page-footer-num" id="rightPageNum">Page 2</div>
            </div>

            <!-- 3D Flipping Animated Leaf Overlay -->
            <div class="flipping-leaf" id="flippingLeaf">
                <div class="leaf-face leaf-front" id="leafFront"></div>
                <div class="leaf-face leaf-back" id="leafBack"></div>
            </div>

        </div>
    </div>

    <footer>
        &copy; 2026 LOG1C. Click page corners or chapter links to turn pages.
    </footer>

    <script>
        // BOOK DATA STRUCTURE (6 Pages arranged across 3 spreads)
        const pages = [
            /* Page 0: Cover / Table of Contents */
            `
                <div class="page-header">
                    <h1 class="page-title">LOG1C</h1>
                    <p class="page-subtitle">Interactive Works & Archive</p>
                </div>
                <div class="content-body">
                    <p>Heya, you can find anything I'm doing, collected knowledge about archaic subjects (alotta magic, or just general shit I enjoy here.</p>
                    
                    <h3 class="section-heading">Table of Contents</h3>
                    <div class="card-grid">
                        <div class="card-item" style="cursor:pointer;" onclick="goToPage(1)">
                            <div class="card-title">1. Fictions &rarr;</div>
                            <div class="card-desc">You'll find links to anything I've authored in the Fiction section here.</div>
                        </div>
                        <div class="card-item" style="cursor:pointer;" onclick="goToPage(2)">
                            <div class="card-title">2. Projects &rarr;</div>
                            <div class="card-desc">Anything stupid I get up to; this could be art projects, writing, .</div>
                        </div>
                        <div class="card-item" style="cursor:pointer;" onclick="goToPage(3)">
                            <div class="card-title">3. Decklists &rarr;</div>
                            <div class="card-desc">This sections specifically for folks looking for my sweatiest stuff (what else would I post here?).</div>
                        </div>
                        <div class="card-item" style="cursor:pointer;" onclick="goToPage(4)">
                            <div class="card-title">4. About LOG1C &rarr;</div>
                            <div class="card-desc">Hire me, skills overview, and direct communication portal.</div>
                        </div>
                    </div>
                </div>
            `,

            /* Page 1: FICTIONS */
            `
                <div class="page-header">
                    <h1 class="page-title">Fictions</h1>
                    <p class="page-subtitle">Stuff I've wrote!</p>
                </div>
                <div class="content-body">
                    <p class="story-text">https://www.royalroad.com/fiction/185363/what-remains-of-matthew<p>
                </div>
            `,

            /* Page 2: PROJECTS */
            `
                <div class="page-header">
                    <h1 class="page-title">Projects</h1>
                    <p class="page-subtitle">Development & Resource Manifests</p>
                </div>
                <div class="content-body">
                    <div class="card-grid">
                        <div class="card-item">
                            <div class="card-title"><a href="recipes.html" style="color:inherit; text-decoration:none;">Recipes &rarr;</a></div>
                            <div class="card-desc">All the random hooha I get into, even game playthroughs from time to time!.</div>
                        </div>
                        <div class="card-item">
                            <div class="card-title"><a href="gamereviews.html" style="color:inherit; text-decoration:none;">Game Reviews &rarr;</a></div>
                            <div class="card-desc">Self proclaimed idiot spouts opinions into the void!</div>
                        </div>
                        <div class="card-item">
                            <div class="card-title"><a href="writing.html" style="color:inherit; text-decoration:none;">Writing Archive &rarr;</a></div>
                            <div class="card-desc">Creative writing!</div>
                        </div>
                        <div class="card-item">
                            <div class="card-title"><a href="blog.html" style="color:inherit; text-decoration:none;">Blog Posts &rarr;</a></div>
                            <div class="card-desc">Raw text logs, real-time thoughts, and general status updates on development.</div>
                        </div>
                    </div>
                </div>
            `,

            /* Page 3: DECKLISTS */
            `
                <div class="page-header">
                    <h1 class="page-title">Decklists</h1>
                    <p class="page-subtitle">Strategic Configurations</p>
                </div>
                <div class="content-body">
                    <p>Card cataloguing and loadouts verified for execution.</p>
                    <div class="card-grid">
                        <div class="card-item">
                            <div class="card-title">Deck Alpha (Prototype)</div>
                            <div class="card-desc">Engineered for quick response actions, low latency, and efficient board-state dominance.</div>
                        </div>
                        <div class="card-item">
                            <div class="card-title">Deck Beta (Control)</div>
                            <div class="card-desc">A passive defense protocol designed to lock down variables and safely contain threats over long intervals.</div>
                        </div>
                    </div>
                </div>
            `,

            /* Page 4: ABOUT */
            `
                <div class="page-header">
                    <h1 class="page-title">About LOG1C</h1>
                    <p class="page-subtitle">Hire Me & Contact</p>
                </div>
                <div class="content-body">
                    <p><strong>Reliable:</strong> Consistent communication until our business concludes. Get a real coder today.</p>
                    <p><strong>Responsive Designs:</strong> Clean, concise, and responsive websites and automation scripts.</p>
                    
                    <h3 class="section-heading">Contact Transmission</h3>
                    <form action="https://script.google.com/macros/s/AKfycbxnB4eel5WBl61cljUVpzMPsU5tWRZAVPGBV3qF7M4Bw-SFNZ67Zu4vDKNmBg_F0XuF/exec" method="POST" class="contact-form">
                        <input type="text" name="name" class="form-control" placeholder="Your Name" required>
                        <input type="email" name="_replyto" class="form-control" placeholder="Your Email" required>
                        <textarea name="message" rows="3" class="form-control" placeholder="Your Message..." required></textarea>
                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>
            `,

            /* Page 5: CREDITS */
            `
                <div class="page-header">
                    <h1 class="page-title">Colophon</h1>
                    <p class="page-subtitle">End of Archive</p>
                </div>
                <div class="content-body">
                    <p>Thank you for exploring this collection.</p>
                    <p>Designed with clean responsive layouts, CSS 3D transforms, and custom page flip mechanics.</p>
                    <br>
                    <button class="submit-btn" style="width:100%;" onclick="goToPage(0)">Return to Table of Contents</button>
                </div>
            `
        ];

        // State Management
        let currentSpread = 0; // 0 = (Page 0 & 1), 1 = (Page 2 & 3), 2 = (Page 4 & 5)
        let isAnimating = false;

        const leftSide = document.getElementById('leftSide');
        const rightSide = document.getElementById('rightSide');
        const leftContent = document.getElementById('leftContent');
        const rightContent = document.getElementById('rightContent');
        const leftPageNum = document.getElementById('leftPageNum');
        const rightPageNum = document.getElementById('rightPageNum');

        const flippingLeaf = document.getElementById('flippingLeaf');
        const leafFront = document.getElementById('leafFront');
        const leafBack = document.getElementById('leafBack');

        // Render current spread static content
        function renderSpread() {
            const leftIdx = currentSpread * 2;
            const rightIdx = currentSpread * 2 + 1;

            leftContent.innerHTML = pages[leftIdx] || '';
            rightContent.innerHTML = pages[rightIdx] || '';

            leftPageNum.textContent = `Page ${leftIdx + 1}`;
            rightPageNum.textContent = `Page ${rightIdx + 1}`;

            updateCornersAndNav();
        }

        // Update active menu buttons and hide corner triggers at limits
        function updateCornersAndNav() {
            const leftCorners = document.querySelectorAll('.top-left, .bottom-left');
            const rightCorners = document.querySelectorAll('.top-right, .bottom-right');

            // Hide previous corners on first page
            leftCorners.forEach(c => c.classList.toggle('disabled', currentSpread === 0));

            // Hide next corners on last page
            const maxSpreads = Math.ceil(pages.length / 2);
            rightCorners.forEach(c => c.classList.toggle('disabled', currentSpread >= maxSpreads - 1));

            // Nav active state
            document.querySelectorAll('.chapter-btn').forEach(btn => btn.classList.remove('active'));
            if (currentSpread === 0) document.getElementById('nav-fictions')?.classList.add('active');
            if (currentSpread === 1) document.getElementById('nav-projects')?.classList.add('active');
            if (currentSpread === 1 && false) document.getElementById('nav-decklists')?.classList.add('active');
            if (currentSpread === 2) document.getElementById('nav-about')?.classList.add('active');
        }

        // 3D PAGE TURN NEXT (Forward Animation)
        function turnNext() {
            if (isAnimating || (currentSpread + 1) * 2 >= pages.length) return;
            isAnimating = true;

            const currentRightIdx = currentSpread * 2 + 1;
            const nextLeftIdx = (currentSpread + 1) * 2;
            const nextRightIdx = (currentSpread + 1) * 2 + 1;

            // Prepare dynamic leaf
            leafFront.innerHTML = pages[currentRightIdx] || '';
            leafBack.innerHTML = pages[nextLeftIdx] || '';

            // Put next right page on underlying static right side
            rightContent.innerHTML = pages[nextRightIdx] || '';
            rightPageNum.textContent = `Page ${nextRightIdx + 1}`;

            // Reset transform & show leaf
            flippingLeaf.style.transition = 'none';
            flippingLeaf.style.transform = 'rotateY(0deg)';
            flippingLeaf.classList.add('active');

            // Force reflow and animate rotateY(0deg -> -180deg)
            void flippingLeaf.offsetWidth;
            flippingLeaf.style.transition = 'transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1)';
            flippingLeaf.style.transform = 'rotateY(-180deg)';

            setTimeout(() => {
                currentSpread++;
                renderSpread();
                flippingLeaf.classList.remove('active');
                isAnimating = false;
            }, 700);
        }

        // 3D PAGE TURN PREVIOUS (Backtrack Animation)
        function turnPrev() {
            if (isAnimating || currentSpread <= 0) return;
            isAnimating = true;

            const prevSpread = currentSpread - 1;
            const prevLeftIdx = prevSpread * 2;
            const prevRightIdx = prevSpread * 2 + 1;
            const currentLeftIdx = currentSpread * 2;

            // Prepare dynamic leaf starting from left side (-180deg)
            leafFront.innerHTML = pages[prevRightIdx] || '';
            leafBack.innerHTML = pages[currentLeftIdx] || '';

            // Put previous left page on underlying static left side
            leftContent.innerHTML = pages[prevLeftIdx] || '';
            leftPageNum.textContent = `Page ${prevLeftIdx + 1}`;

            // Set initial rotation on left side (-180deg)
            flippingLeaf.style.transition = 'none';
            flippingLeaf.style.transform = 'rotateY(-180deg)';
            flippingLeaf.classList.add('active');

            // Force reflow and animate rotateY(-180deg -> 0deg)
            void flippingLeaf.offsetWidth;
            flippingLeaf.style.transition = 'transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1)';
            flippingLeaf.style.transform = 'rotateY(0deg)';

            setTimeout(() => {
                currentSpread--;
                renderSpread();
                flippingLeaf.classList.remove('active');
                isAnimating = false;
            }, 700);
        }

        // Direct Navigation to specific page index
        function goToPage(targetPageIndex) {
            const targetSpread = Math.floor(targetPageIndex / 2);
            if (targetSpread === currentSpread || isAnimating) return;

            if (targetSpread > currentSpread) {
                turnNext();
                if (targetSpread > currentSpread + 1) {
                    setTimeout(() => goToPage(targetPageIndex), 750);
                }
            } else {
                turnPrev();
                if (targetSpread < currentSpread - 1) {
                    setTimeout(() => goToPage(targetPageIndex), 750);
                }
            }
        }

        // Initial Load
        renderSpread();
    </script>
</body>
</html>
